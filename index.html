<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0,minimal-ui"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Keep all your loyalty, membership and gift cards in one place. Snap a photo of a card's barcode or QR code and show it at the checkout, even offline."
    />
    <meta name="theme-color" content="#178a3a" />
    <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/logo/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cards" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="design.css" />
    <script type="module" src="app.js"></script>
    <title>Card Manager</title>
  </head>
  <body>
    <nav class="bottom">
      <a data-ui="#home" class="active">
        <i>home</i>
        <div>Home</div>
      </a>
      <a data-ui="#profile">
        <i>person</i>
        <div>Profile</div>
      </a>
    </nav>

    <main class="responsive center-align">
      <!-- Home -->
      <div id="home" class="active page padding">
        <div id="list"></div>
      </div>

      <!-- Profile -->
      <div id="profile" class="page padding">
        <button class="responsive" id="reset">Reset</button>
        <hr class="small" />
        <button class="responsive" id="import">
          <span>Import</span>
          <input
            onchange="importFilesFromJson(this.files[0]);"
            id="file-input"
            type="file"
            accept="application/JSON"
            style="display: none"
          />
        </button>
        <hr class="small" />
        <button class="responsive" id="export">Export</button>
        <hr class="small" />
        <details class="large">
          <summary>Licenses</summary>
          <a
            class="link"
            href="https://github.com/john-doherty/long-press-event?tab=MIT-1-ov-file#readme"
            >john-doherty/long-press-event</a
          >
        </details>
      </div>
      <button class="circle extra" id="fab-button">
        <i class="responsive extra">add_a_photo</i>
        <span>Photo</span>
        <input type="file" accept="image/*" id="upload" />
      </button>

      <!-- Full screen code viewer, shown when tapping a card -->
      <dialog id="viewer" class="max">
        <img id="viewer-image" alt="" />
      </dialog>

      <!-- Confirmation for destructive actions -->
      <dialog id="confirm-dialog">
        <form method="dialog" class="left-align">
          <h5 id="confirm-title"></h5>
          <p id="confirm-message"></p>
          <nav class="right-align no-space">
            <button type="submit" value="cancel" class="transparent link">Cancel</button>
            <button type="submit" value="confirm" class="error" id="confirm-action"></button>
          </nav>
        </form>
      </dialog>

      <!-- New card details, shown after picking a photo -->
      <dialog id="card-dialog">
        <form method="dialog" class="left-align">
          <h5>New card</h5>
          <div class="field label border">
            <input type="text" name="title" id="card-title" />
            <label>Title</label>
          </div>
          <div class="field label border">
            <input type="color" name="color" id="card-color" value="#ffffff" />
            <label>Card color</label>
          </div>
          <nav class="right-align no-space">
            <button type="submit" value="cancel" class="transparent link">Cancel</button>
            <button type="submit" value="save">Save</button>
          </nav>
        </form>
      </dialog>
    </main>
  </body>
</html>
